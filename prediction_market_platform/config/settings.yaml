# ==============================================================================
# PREDICTION MARKET RESEARCH PLATFORM - CONFIGURATION
# ==============================================================================
# This platform is for RESEARCH ONLY - No automated trading
# All insights require manual execution and human judgment
# ==============================================================================

platform:
  name: "Prediction Market Research Platform"
  version: "1.0.0"
  mode: "research"  # NEVER change to "trading"

# ------------------------------------------------------------------------------
# DATA SOURCES
# ------------------------------------------------------------------------------
data_sources:
  polymarket:
    enabled: true
    base_url: "https://clob.polymarket.com"
    gamma_url: "https://gamma-api.polymarket.com"
    snapshot_interval_minutes: 15
    max_markets_per_fetch: 500

  kalshi:
    enabled: true
    base_url: "https://trading-api.kalshi.com/trade-api/v2"
    snapshot_interval_minutes: 15
    max_markets_per_fetch: 200

# ------------------------------------------------------------------------------
# DATABASE CONFIGURATION
# ------------------------------------------------------------------------------
database:
  type: "sqlite"  # sqlite, parquet, or both
  sqlite_path: "data/prediction_markets.db"
  parquet_path: "data/parquet/"
  retention_days: 365

# ------------------------------------------------------------------------------
# STRATEGY CONFIGURATION
# ------------------------------------------------------------------------------
strategies:
  # Structural Edges - exploit market microstructure
  structural:
    liquidity_vacuum:
      enabled: true
      weight: 1.2
      min_spread_threshold: 0.05  # 5% spread = potential opportunity
      liquidity_depth_threshold: 1000  # USD

    order_book_imbalance:
      enabled: true
      weight: 1.0
      imbalance_threshold: 0.3  # 30% imbalance
      lookback_periods: 5

    late_resolution_inefficiency:
      enabled: true
      weight: 1.5  # High weight - empirically strongest edge
      hours_to_resolution_threshold: 24
      convergence_speed_factor: 0.8

    spread_exploitation:
      enabled: true
      weight: 0.9
      min_spread: 0.02
      max_spread: 0.15

  # Behavioral Edges - exploit human psychology
  behavioral:
    favorite_longshot_bias:
      enabled: true
      weight: 1.3
      favorite_threshold: 0.85  # >85% implied prob
      longshot_threshold: 0.15  # <15% implied prob
      bias_adjustment: 0.05

    overreaction_to_news:
      enabled: true
      weight: 1.1
      price_change_threshold: 0.10  # 10% move
      reversion_window_hours: 6

    herding_near_expiration:
      enabled: true
      weight: 1.0
      expiration_window_hours: 48
      volume_spike_threshold: 2.0  # 2x normal volume

    anchoring_bias:
      enabled: true
      weight: 0.8
      anchor_decay_days: 7

  # Temporal Edges - exploit time dynamics
  temporal:
    time_decay_inefficiency:
      enabled: true
      weight: 1.1
      decay_curve: "exponential"
      optimal_entry_hours: 72

    pre_resolution_convergence:
      enabled: true
      weight: 1.4
      convergence_window_hours: 12
      expected_convergence_rate: 0.15

    volatility_clustering:
      enabled: true
      weight: 0.9
      cluster_detection_window: 24
      volatility_threshold: 0.08

  # Informational Edges - exploit information gaps
  informational:
    cross_market_arbitrage:
      enabled: true
      weight: 1.5
      correlation_threshold: 0.7
      divergence_threshold: 0.05

    forecast_aggregation_gap:
      enabled: true
      weight: 1.2
      external_sources:
        - "538"
        - "metaculus"
        - "predictit"
      divergence_threshold: 0.08

    slow_updating_markets:
      enabled: true
      weight: 1.0
      staleness_hours: 6
      expected_update_frequency: 1

# ------------------------------------------------------------------------------
# OPPORTUNITY SCORING
# ------------------------------------------------------------------------------
scoring:
  # Weights for final opportunity score
  weights:
    expected_value: 0.30
    confidence: 0.20
    liquidity: 0.15
    time_horizon: 0.10
    historical_edge_strength: 0.15
    risk_profile: 0.10

  # Minimum thresholds to include in rankings
  thresholds:
    min_expected_value: 0.02  # 2% minimum edge
    min_confidence: 0.6
    min_liquidity_usd: 500
    max_time_to_resolution_days: 30

  # Output configuration
  output:
    top_opportunities: 50
    include_explanations: true
    export_formats:
      - "csv"
      - "markdown"
      - "json"

# ------------------------------------------------------------------------------
# BACKTESTING
# ------------------------------------------------------------------------------
backtesting:
  default_start_date: "2023-01-01"
  default_end_date: null  # null = today
  initial_capital: 10000
  position_size_pct: 0.05  # 5% per position
  max_positions: 20

  metrics:
    - "roi"
    - "hit_rate"
    - "brier_score"
    - "calibration_error"
    - "sharpe_ratio"
    - "max_drawdown"
    - "profit_factor"

  slippage:
    model: "percentage"  # percentage or fixed
    value: 0.005  # 0.5%

# ------------------------------------------------------------------------------
# RISK MANAGEMENT (for position sizing recommendations only)
# ------------------------------------------------------------------------------
risk:
  max_single_position_pct: 0.10  # 10% of capital
  max_correlated_exposure_pct: 0.25  # 25% in correlated markets
  kelly_fraction: 0.25  # Quarter Kelly

# ------------------------------------------------------------------------------
# REPORTING
# ------------------------------------------------------------------------------
reporting:
  daily_report:
    enabled: true
    output_path: "output/reports/daily/"
    format: "markdown"

  strategy_report:
    enabled: true
    output_path: "output/reports/strategy/"
    include_charts: true

  export:
    csv_path: "output/csv_exports/"
    json_path: "output/json_exports/"

# ------------------------------------------------------------------------------
# FILTERS
# ------------------------------------------------------------------------------
filters:
  # Market type filters
  exclude_categories: []
  include_only_categories: []  # Empty = all

  # Liquidity filters
  min_total_volume: 1000
  min_open_interest: 500

  # Time filters
  exclude_resolved: true
  exclude_cancelled: true
  min_hours_to_resolution: 1

# ------------------------------------------------------------------------------
# LOGGING
# ------------------------------------------------------------------------------
logging:
  level: "INFO"
  file_path: "logs/platform.log"
  max_size_mb: 100
  backup_count: 5

# ==============================================================================
# RISK DISCLAIMER
# ==============================================================================
# THIS PLATFORM IS FOR RESEARCH AND EDUCATIONAL PURPOSES ONLY
#
# - No automated trading functionality is implemented
# - All insights require manual verification
# - Past performance does not guarantee future results
# - Prediction markets involve substantial risk of loss
# - Only trade with capital you can afford to lose
# ==============================================================================
