# ==============================================================================
# Prediction Market Research Platform - Docker Compose Configuration
# ==============================================================================
# Usage:
#   Development:  docker-compose up
#   Production:   docker-compose -f docker-compose.yml -f docker-compose.prod.yml up
#   Testing:      docker-compose run --rm test
# ==============================================================================

version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # Web Dashboard Service
  # ----------------------------------------------------------------------------
  web:
    build:
      context: .
      target: production
    container_name: pm-research-web
    ports:
      - "${FLASK_PORT:-5000}:5000"
    environment:
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-change-this-in-production}
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5000
      - FLASK_DEBUG=${FLASK_DEBUG:-false}
      - DATABASE_PATH=/app/data/prediction_markets.db
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FILE=/app/logs/platform.log
      # API Keys (optional)
      - API_KEY=${API_KEY:-}
      - API_KEY_ENABLED=${API_KEY_ENABLED:-false}
      # CORS
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      # Social API Keys
      - TWITTER_BEARER_TOKEN=${TWITTER_BEARER_TOKEN:-}
      - REDDIT_CLIENT_ID=${REDDIT_CLIENT_ID:-}
      - REDDIT_CLIENT_SECRET=${REDDIT_CLIENT_SECRET:-}
    volumes:
      - pm-data:/app/data
      - pm-logs:/app/logs
      - pm-output:/app/output
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - pm-network

  # ----------------------------------------------------------------------------
  # Data Collector Service (runs periodically)
  # ----------------------------------------------------------------------------
  collector:
    build:
      context: .
      target: production
    container_name: pm-research-collector
    command: ["python", "cli.py", "live", "--interval", "300"]
    environment:
      - DATABASE_PATH=/app/data/prediction_markets.db
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FILE=/app/logs/collector.log
      # Social API Keys
      - TWITTER_BEARER_TOKEN=${TWITTER_BEARER_TOKEN:-}
      - REDDIT_CLIENT_ID=${REDDIT_CLIENT_ID:-}
      - REDDIT_CLIENT_SECRET=${REDDIT_CLIENT_SECRET:-}
    volumes:
      - pm-data:/app/data
      - pm-logs:/app/logs
    restart: unless-stopped
    depends_on:
      - web
    networks:
      - pm-network
    profiles:
      - full

  # ----------------------------------------------------------------------------
  # Test Service
  # ----------------------------------------------------------------------------
  test:
    build:
      context: .
      target: testing
    container_name: pm-research-test
    environment:
      - DATABASE_PATH=/tmp/test_db.sqlite
      - LOG_LEVEL=WARNING
    volumes:
      - ./tests:/app/tests:ro
      - ./engine:/app/engine:ro
      - ./strategies:/app/strategies:ro
      - ./web:/app/web:ro
    networks:
      - pm-network
    profiles:
      - test

  # ----------------------------------------------------------------------------
  # Development Service
  # ----------------------------------------------------------------------------
  dev:
    build:
      context: .
      target: development
    container_name: pm-research-dev
    ports:
      - "${FLASK_PORT:-5000}:5000"
    environment:
      - FLASK_SECRET_KEY=dev-secret-key-not-for-production
      - FLASK_DEBUG=true
      - DATABASE_PATH=/app/data/prediction_markets.db
      - LOG_LEVEL=DEBUG
    volumes:
      - .:/app
      - pm-data:/app/data
      - pm-logs:/app/logs
    networks:
      - pm-network
    profiles:
      - dev

# ------------------------------------------------------------------------------
# Volumes
# ------------------------------------------------------------------------------
volumes:
  pm-data:
    driver: local
  pm-logs:
    driver: local
  pm-output:
    driver: local

# ------------------------------------------------------------------------------
# Networks
# ------------------------------------------------------------------------------
networks:
  pm-network:
    driver: bridge
